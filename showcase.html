<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain by CoinPayments — Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0a0a1a 0%, #0d1b2a 30%, #1b2838 60%, #0a0a1a 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Ambient glow behind the phone */
  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,122,255,0.08) 0%, rgba(0,122,255,0.02) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
    50% { transform: translateY(-40px) scale(1.5); opacity: 0.4; }
  }

  /* Phone container with 3D perspective */
  .phone-scene {
    perspective: 1800px;
    z-index: 1;
    margin-bottom: 40px;
  }

  .phone-wrapper {
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .phone-wrapper:hover {
    transform: rotateY(-5deg) rotateX(2deg) scale(1.02);
  }

  /* iPhone 15 Pro frame — CSS only */
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 55px;
    background: linear-gradient(145deg, #2a2a2e 0%, #1a1a1e 50%, #0f0f12 100%);
    padding: 12px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 0 0 2px rgba(60,60,65,0.8),
      0 25px 80px rgba(0,0,0,0.7),
      0 10px 30px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 0 120px rgba(0,122,255,0.06);
  }

  /* Titanium side buttons */
  .phone::before {
    content: '';
    position: absolute;
    right: -3px;
    top: 180px;
    width: 4px;
    height: 36px;
    background: linear-gradient(180deg, #3a3a3e, #2a2a2e);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 55px 0 #2a2a2e;
  }
  .phone::after {
    content: '';
    position: absolute;
    left: -3px;
    top: 140px;
    width: 4px;
    height: 22px;
    background: linear-gradient(180deg, #3a3a3e, #2a2a2e);
    border-radius: 3px 0 0 3px;
    box-shadow:
      0 30px 0 #2a2a2e,
      0 60px 0 #2a2a2e,
      0 90px 0 #2a2a2e;
  }

  /* Screen area */
  .screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #000;
    position: relative;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
  }

  /* Screen iframe */
  .screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 44px;
    background: #fff;
  }

  /* Scroll indicator */
  .scroll-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    z-index: 10;
  }

  /* Reflection/shine on screen glass */
  .screen-shine {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 44px;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0.03) 0%,
      transparent 40%,
      transparent 60%,
      rgba(255,255,255,0.01) 100%
    );
    pointer-events: none;
    z-index: 11;
  }

  /* Title below the phone */
  .title-section {
    text-align: center;
    z-index: 1;
    margin-top: 10px;
  }

  .title-section h1 {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .title-section h1 span {
    background: linear-gradient(90deg, #007AFF, #5AC8FA, #007AFF);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .title-section p {
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .title-section .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 18px;
    background: rgba(0,122,255,0.1);
    border: 1px solid rgba(0,122,255,0.3);
    border-radius: 20px;
    font-size: 12px;
    color: rgba(0,122,255,0.9);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .phone {
      width: 320px;
      height: 693px;
      border-radius: 46px;
      padding: 10px;
    }
    .screen { border-radius: 38px; }
    .screen iframe { border-radius: 38px; }
    .dynamic-island { width: 104px; height: 30px; top: 10px; }
    .screen-shine { border-radius: 38px; }
    .title-section h1 { font-size: 28px; }
    .title-section p { font-size: 14px; }
  }

  @media (max-width: 480px) {
    .phone {
      width: 280px;
      height: 607px;
      border-radius: 40px;
      padding: 8px;
    }
    .screen { border-radius: 34px; }
    .screen iframe { border-radius: 34px; }
    .dynamic-island { width: 90px; height: 26px; top: 8px; border-radius: 16px; }
    .screen-shine { border-radius: 34px; }
    .scroll-hint { width: 100px; }
  }

  /* App URL input */
  .url-bar {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1;
  }
  .url-bar input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 14px;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    width: 260px;
    font-family: 'SF Mono', 'Menlo', monospace;
    outline: none;
    transition: border-color 0.2s;
  }
  .url-bar input:focus {
    border-color: rgba(0,122,255,0.5);
  }
  .url-bar button {
    background: rgba(0,122,255,0.2);
    border: 1px solid rgba(0,122,255,0.4);
    border-radius: 8px;
    padding: 8px 16px;
    color: #007AFF;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .url-bar button:hover {
    background: rgba(0,122,255,0.35);
  }
</style>
</head>
<body>

<!-- Ambient glow -->
<div class="glow"></div>

<!-- Floating particles -->
<div class="particle" style="top:15%;left:20%;animation-delay:0s"></div>
<div class="particle" style="top:25%;left:70%;animation-delay:1.5s"></div>
<div class="particle" style="top:60%;left:15%;animation-delay:3s"></div>
<div class="particle" style="top:75%;left:80%;animation-delay:4.5s"></div>
<div class="particle" style="top:40%;left:50%;animation-delay:2s"></div>
<div class="particle" style="top:85%;left:35%;animation-delay:6s"></div>
<div class="particle" style="top:10%;left:85%;animation-delay:0.5s"></div>

<!-- Phone -->
<div class="phone-scene">
  <div class="phone-wrapper" id="phoneWrapper">
    <div class="phone">
      <div class="screen">
        <div class="dynamic-island"></div>
        <iframe id="appFrame" src="http://localhost:8081" allow="clipboard-write"></iframe>
        <div class="screen-shine"></div>
        <div class="scroll-hint"></div>
      </div>
    </div>
  </div>
</div>

<!-- Title -->
<div class="title-section">
  <h1><span>CoinPayments</span> — Powered by AiRook</h1>
  <p>Crypto wallet &amp; card — beautifully simple</p>
  <div class="badge">Preview Build</div>
</div>

<!-- URL bar for changing the app URL -->
<div class="url-bar">
  <input id="urlInput" type="text" value="http://localhost:8081" placeholder="Expo dev server URL" />
  <button onclick="loadUrl()">Load</button>
</div>

<script>
// 3D tilt effect following mouse
const wrapper = document.getElementById('phoneWrapper');
const scene = document.querySelector('.phone-scene');

document.addEventListener('mousemove', (e) => {
  if (window.matchMedia('(hover: none)').matches) return; // skip touch devices
  
  const rect = scene.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  
  const deltaX = (e.clientX - centerX) / window.innerWidth;
  const deltaY = (e.clientY - centerY) / window.innerHeight;
  
  const rotateY = deltaX * 12; // max 12 degrees
  const rotateX = -deltaY * 8; // max 8 degrees
  
  wrapper.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
});

// Reset on mouse leave
document.addEventListener('mouseleave', () => {
  wrapper.style.transform = 'rotateY(0deg) rotateX(0deg)';
});

// URL bar
function loadUrl() {
  const url = document.getElementById('urlInput').value.trim();
  document.getElementById('appFrame').src = url;
}

document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadUrl();
});

// Prevent scroll on body from bleeding through
document.body.addEventListener('wheel', (e) => {
  // Only prevent if not hovering over the phone
}, { passive: true });
</script>

</body>
</html>
